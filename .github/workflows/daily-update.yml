name: daily-data-update

# 每个工作日北京时间 08:41 主跑（UTC 00:41）、11:07 兜底（UTC 03:07）：
# A股 09:30 开盘前出数，中证500/上海金用上一个交易日的收盘、纳指用今晨
# 刚收盘的美股数据——三者都是已完成收盘，且当天交易时段内即可照此分配买入。
# 原定 09:00（UTC 01:00 整点）连续两日不可靠：2026-11-09 被 GitHub 延迟到
# 15:18 才启动、11-10 到 11:00 仍未触发，故挪开整点并加一档兜底；两档算的是
# 同一批已完成收盘，第一档已成功时第二档无变化、不会重复提交。
# 也可以在 Actions 页面手动触发。
on:
  schedule:
    - cron: "41 0 * * 1-5"
    - cron: "7 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data, verify (dual-source) and compute allocation
        run: python scripts/fetch_data.py

      - name: Compute invested returns estimate (data/returns.json)
        continue-on-error: true
        run: python scripts/fetch_returns.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv data/returns.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 每日分配数据自动更新 ($(TZ=Asia/Shanghai date +%F))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "push 失败（可能与月度流水线并发撞车），5 秒后重试 ($i/3)"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "push 三次均失败"; exit 1; fi
          fi
