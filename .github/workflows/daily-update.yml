name: daily-data-update

# 触发方式（2026-11-11 起）：
# - 主触发：外部定时器（cron-job.org）每个工作日北京时间 08:41 调用
#   repository_dispatch API（事件名 daily-update），绕开 GitHub 自家定时
#   队列——GitHub 的 schedule 连续多日延迟数小时甚至丢弃（2026-11-09
#   定时迟到到 15:18 才启动、11-10 迟到到 19:05、11-11 的 08:41 到
#   09:38 仍未触发），API 触发不走调度队列、不受此影响。
#   对接配置见 docs/external-trigger.md。
# - 兜底：GitHub 自带定时 08:41（UTC 00:41）与 11:07（UTC 03:07）保留，
#   外部触发当天没来时还有机会补上；各档算的是同一批已完成收盘，
#   先成功的一档之后，下一档无数据变化时不会重复提交（仅更新时间
#   变化时多一个提交，属正常）。
# - 闸门（2026-11-12 扩围）：带 backup 标记的外部触发、与 GitHub 自带
#   定时（08:41 与 11:07 两档），先检查 data/latest.json 与
#   data/returns.json 的更新日期是否均为今天，均为今天说明今天的活已
#   干完，本轮整轮跳过、不抓数不提交；任一不是今天才真正执行补跑。
#   外部 08:41 主触发（repository_dispatch 无 backup 标记）与手动触发
#   不受闸门影响，照常执行。扩围原因：2026-11-12 GitHub 自带 08:41
#   定时迟到近 7 小时（15:39 才触发，运行 #20），在外部触发已更新数据
#   后仍全量重跑并死在抓数步，白发一封失败告警邮件。
# - 手动：Actions 页面 workflow_dispatch。
# 数据口径：A股 09:30 开盘前出数，中证500/上海金用上一个交易日的收盘、
# 纳指用今晨刚收盘的美股数据——三者都是已完成收盘。
# 失败告警（审计 P2-2）：任一步骤硬失败、或收益步骤（按设计
# continue-on-error、不阻断主数据）失败时，末尾告警步自动建 issue
# 留痕（同日同名去重），不再悄无声息。

on:
  schedule:
    - cron: "41 0 * * 1-5"
    - cron: "7 3 * * 1-5"
  repository_dispatch:
    types: [daily-update]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate (skip if already updated today)
        id: gate
        if: ${{ github.event.client_payload.slot == 'backup' || github.event_name == 'schedule' }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          LATEST_DATE=$(python3 -c "import json; print(json.load(open('data/latest.json'))['updated_at_bj'][:10])")
          RETURNS_DATE=$(python3 -c "import json; print(json.load(open('data/returns.json'))['updated_at_bj'][:10])")
          echo "latest.json 更新日期 $LATEST_DATE，returns.json 更新日期 $RETURNS_DATE，今天 $TODAY"
          if [ "$LATEST_DATE" = "$TODAY" ] && [ "$RETURNS_DATE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今日数据已更新，本轮跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "今日数据未齐，本轮执行"
          fi

      - name: Setup Python
        if: ${{ steps.gate.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data, verify (dual-source) and compute allocation
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: python scripts/fetch_data.py

      - name: Compute invested returns estimate (data/returns.json)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        id: returns
        continue-on-error: true
        run: python scripts/fetch_returns.py

      - name: Commit data if changed
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv data/returns.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 每日分配数据自动更新 ($(TZ=Asia/Shanghai date +%F))"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "push 失败（可能与月度流水线并发撞车），5 秒后重试 ($i/3)"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "push 三次均失败"; exit 1; fi
          fi

      - name: Alert on workflow failure (auto issue, P2-2)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          TITLE="每日数据更新异常 $TODAY"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="每日数据更新工作流本次运行失败（多半死在抓数/双源校验或提交步骤），页面数据未更新。失败那一步的日志末尾有具体原因（哪个标的、主源与校验源各是多少）。运行详情：$RUN_URL"
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" != "0" ]; then
            echo "今日已有同名告警 issue，跳过重复创建"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "建 issue 失败，不影响主流程"
          fi

      - name: Alert on returns failure (auto issue, P2-2)
        if: ${{ always() && steps.returns.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          TITLE="每日数据更新异常 $TODAY"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="收益估算步骤（fetch_returns.py）本次失败：latest.json 已照常更新，但 returns.json 未更新，页面收益曲线可能滞后。运行详情：$RUN_URL"
          EXISTING=$(gh issue list --state open --search "$TITLE" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" != "0" ]; then
            echo "今日已有同名告警 issue，跳过重复创建"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "建 issue 失败，不影响主流程"
          fi
